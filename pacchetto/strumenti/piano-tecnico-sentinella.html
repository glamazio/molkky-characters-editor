<script type="module">
const root=document.getElementById('documento');
function inline(parent,text){const pattern=/(\[[^\]]+\]\(https?:\/\/[^\s)]+\)|\*\*[^*]+\*\*|`[^`]+`)/g;let last=0;for(const m of text.matchAll(pattern)){parent.append(document.createTextNode(text.slice(last,m.index)));const value=m[0];let node;if(value.startsWith('[')){const match=value.match(/^\[([^\]]+)\]\((https?:\/\/[^)]+)\)$/);node=document.createElement('a');node.href=match[2];node.textContent=match[1];}else if(value.startsWith('**')){node=document.createElement('strong');node.textContent=value.slice(2,-2);}else{node=document.createElement('code');node.textContent=value.slice(1,-1);}parent.append(node);last=m.index+value.length;}parent.append(document.createTextNode(text.slice(last)));}
function render(text){root.replaceChildren();let list=null,pre=null;for(const line of text.split(/\r?\n/)){if(line.startsWith('```')){list=null;if(pre){pre=null;}else{pre=document.createElement('code');const container=document.createElement('pre');container.append(pre);root.append(container);}continue;}if(pre){pre.append(document.createTextNode(line+'\n'));continue;}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){list=null;const el=document.createElement('h'+h[1].length);inline(el,h[2]);root.append(el);continue;}const bullet=line.match(/^\s*([-*]|\d+\.)\s+(.+)$/);if(bullet){const type=/\d/.test(bullet[1])?'ol':'ul';if(!list||list.tagName.toLowerCase()!==type){list=document.createElement(type);root.append(list);}const li=document.createElement('li');inline(li,bullet[2]);list.append(li);continue;}list=null;if(line.trim()){const p=document.createElement('p');inline(p,line);root.append(p);}}}
try{const response=await fetch('./PIANO-TECNICO-SENTINELLA.md',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);render(await response.text());}catch(e){root.textContent='Impossibile caricare il piano: '+e.message;}
</script></body></html>
